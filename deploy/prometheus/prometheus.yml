global:
  scrape_interval: 15s

scrape_configs:
  # Métricas da aplicação (exportadas pelo Collector em :8889)
  - job_name: otel-collector-app
    static_configs:
      - targets: ["otel-collector:8889"]

  # Métricas do PRÓPRIO Collector — quem observa o observador.
  # Atenção a: otelcol_processor_tail_sampling_sampling_trace_dropped_too_early
  # (decision_wait curto), otelcol_exporter_send_failed_spans (backpressure),
  # otelcol_processor_refused_spans (memory_limiter atuando).
  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]
